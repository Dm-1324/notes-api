spring.application.name=notes-api

# Values come from App Service "app settings" (environment variables)
app.version=${APP_VERSION:1.0.0}
storage.account-name=${STORAGE_ACCOUNT_NAME:changeme}
storage.container=notes

# Key Vault: the vault URL is not a secret; the API key itself stays in the vault
keyvault.url=${KEYVAULT_URL:https://changeme.vault.azure.net/}
keyvault.api-key-secret-name=notes-api-key

# /actuator/health - used by the App Service health check
management.endpoints.web.exposure.include=health
